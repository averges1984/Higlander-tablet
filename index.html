<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#00131c">
<title>Highlander Passenger Portal</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#00131c;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}
#stage{
  position:fixed;left:50%;top:50%;
  width:1672px;height:941px;
  transform-origin:center center;
}
#dashboard{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;user-select:none;-webkit-user-drag:none;
}
.hotspot{
  position:absolute;display:block;text-decoration:none;border-radius:18px;
  background:rgba(255,255,255,0);cursor:pointer;
}
.hotspot:active{background:rgba(255,255,255,.08)}

/* Modal overlays */
.modal{
  display:none;position:absolute;inset:0;z-index:50;
  background:rgba(0,10,16,.92);align-items:center;justify-content:center;
  padding:5%;
}
.modal.active{display:flex}
.panel{
  width:78%;max-width:1000px;max-height:84%;
  background:linear-gradient(135deg,#0b1c28,#07131c);
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;padding:28px;color:white;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  overflow:auto;
}
.close{
  position:absolute;right:7%;top:7%;
  width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  background:#0c2230;color:white;font-size:30px;
  display:grid;place-items:center;text-decoration:none;z-index:60;
}
.card-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:100%;
}
.card-wrap img{
  max-width:92%;max-height:72vh;border-radius:18px;
  box-shadow:0 18px 48px rgba(0,0,0,.45)
}
.ride-panel h2,.tip-panel h2{margin:0 0 12px;font-size:42px}
.ride-panel p,.tip-panel p{font-size:21px;line-height:1.5;color:#d8e4ea}
.tagline{
  color:#f4a62a;font-size:26px;font-weight:800;margin-top:18px
}
.small-note{font-size:15px;color:#9fb1bc;margin-top:14px}

/* Better full-screen fit for iPad and iPhone landscape */
@media (orientation:portrait){
  body:before{
    content:"Rotate device for best view";
    position:fixed;left:50%;top:18px;transform:translateX(-50%);
    color:#b8c8d2;font-size:14px;z-index:100;
  }
}
</style>
</head>
<body>
<div id="stage">
  <img id="dashboard" src="dashboard_final.png" alt="Highlander Passenger Portal">

  <!-- App tiles: 6 visible cards -->
  <a class="hotspot" style="left:1.5%;top:42.0%;width:15.0%;height:18.8%" href="https://www.youtube.com/" target="_blank" aria-label="YouTube"></a>
  <a class="hotspot" style="left:17.3%;top:42.0%;width:15.0%;height:18.8%" href="https://www.youtubekids.com/" target="_blank" aria-label="YouTube Kids"></a>
  <a class="hotspot" style="left:33.1%;top:42.0%;width:15.0%;height:18.8%" href="https://open.spotify.com/" target="_blank" aria-label="Spotify"></a>
  <a class="hotspot" style="left:48.9%;top:42.0%;width:15.0%;height:18.8%" href="https://www.crazygames.com/" target="_blank" aria-label="Games"></a>
  <a class="hotspot" style="left:64.7%;top:42.0%;width:15.0%;height:18.8%" href="https://pbskids.org/games/" target="_blank" aria-label="PBS KIDS Games"></a>
  <a class="hotspot" style="left:80.5%;top:42.0%;width:17.8%;height:18.8%" href="https://www.youtube.com/results?search_query=relaxing+music" target="_blank" aria-label="Relax Audio"></a>

  <!-- Bottom service cards -->
  <a class="hotspot" style="left:1.4%;top:62.7%;width:32.0%;height:34.2%" href="#" onclick="openModal('realestate');return false" aria-label="Real Estate Services"></a>
  <a class="hotspot" style="left:34.1%;top:62.7%;width:31.8%;height:34.2%" href="#" onclick="openModal('rides');return false" aria-label="Need a ride later"></a>
  <a class="hotspot" style="left:66.7%;top:62.7%;width:31.8%;height:34.2%" href="#" onclick="openModal('tips');return false" aria-label="Tips appreciated"></a>

  <!-- Real estate card -->
  <div id="realestate" class="modal">
    <a class="close" href="#" onclick="closeModals();return false">×</a>
    <div class="panel card-wrap">
      <img src="realtor_card.jpg" alt="Alberto Verges Real Estate Agent business card">
    </div>
  </div>

  <!-- Ride later: intentionally no phone number -->
  <div id="rides" class="modal">
    <a class="close" href="#" onclick="closeModals();return false">×</a>
    <div class="panel ride-panel">
      <h2>Need a ride later?</h2>
      <p>Airport • Long Distance • Hourly</p>
      <div class="tagline">Feel free to ask me!</div>
      <p class="small-note">Please ask your driver directly for availability and details.</p>
    </div>
  </div>

  <!-- Tips -->
  <div id="tips" class="modal">
    <a class="close" href="#" onclick="closeModals();return false">×</a>
    <div class="panel tip-panel">
      <h2>Tips are appreciated!</h2>
      <p>Tips can be left directly in the Uber or Lyft app. Thank you!</p>
    </div>
  </div>
</div>

<script>
function fit(){
  const safeW = window.innerWidth;
  const safeH = window.innerHeight;
  const scale = Math.min(safeW/1672, safeH/941);
  const stage = document.getElementById('stage');
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
function openModal(id){
  closeModals();
  document.getElementById(id).classList.add('active');
}
function closeModals(){
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('active'));
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,250));
fit();
</script>
</body>
</html>
